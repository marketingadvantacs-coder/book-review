<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Конструктор рецензий на книги</title>
  <meta name="description" content="Заполните анкету и получите готовую рецензию на книгу — всё работает прямо в браузере." />
  <style>
    :root {
      --bg: #f6f7fb;  --card: #ffffff; --ink: #1e1f23; --muted:#6b7280; --brand:#c6122d; --accent:#0ea5e9;
      --ok:#10b981; --warn:#f59e0b; --radius:18px; --shadow: 0 6px 24px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    .wrap{max-width:560px;margin:0 auto;padding:12px}
    header{display:flex;gap:10px;align-items:center;margin:10px 0 14px}
    .logo{width:44px;height:44px;border-radius:12px;object-fit:contain;box-shadow:0 6px 18px rgba(198,18,45,.15);background:#fff;padding:4px}
    h1{font-size:20px;margin:0}
    .sub{color:var(--muted);margin-top:2px;font-size:13px}

    .card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
    .card h2{margin-bottom:8px;font-size:16px}
    label{display:block;font-weight:600;font-size:13px;color:#111827;margin-top:8px}
    input[type="text"], input[type="date"], textarea{
      width:100%;padding:10px 12px;margin-top:4px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;outline:none;transition:.2s;font-size:15px
    }
    textarea{min-height:90px;resize:vertical}
    input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(14,165,233,.15)}

    .toolbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px;background:var(--card);padding:8px;border-radius:16px;box-shadow:var(--shadow)}
    @media (min-width:480px){.toolbar{grid-template-columns:1fr 1fr 1fr}}
    button{appearance:none;border:0;border-radius:14px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,.1)}
    .warn{background:var(--brand)}
    .ok{background:var(--brand)}

    .out{white-space:pre-wrap;min-height:200px;font-family:ui-monospace, monospace;margin-top:8px}
    .footer{margin-top:10px;color:var(--muted);font-size:12px;text-align:center}

    .grid{display:block}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="logo" alt="логотип" src="лого к.png" decoding="async" onerror="this.onerror=null;this.src='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAARkAAAEZCAYAAACjEFEXAAAACXBIWXMAAC4jAAAuIwF4pT92AAAODElEQVR4nO3d/3HayB/G8cdMCuCrBg4XoAlRA8EVnFNBcAW2K3BcQZwKTCqIrwKTBhRuVMApDWi4Dr5/SPJhjEAC7a60er9mMkOwQZ+JyeP9qT1TA3EQXkr6KGkqadbktRiUtaSVpJ+SnqIsWTmuBw6dHfqGOAjHkm4kfZY0MV0QvLSU9D3KkoXjOuDA3pApWi5fRbigHUtJt7RshqUyZOIgfJQ0t1cKBmKtPGgWrguBHW9CpugePSsfdwFMeYiy5NZ1ETBvtOM5AgY23MRB+MV1ETDvVcgUXSQCBrbcFeN+8NhLd6n4Yf9wWAuGaS3pQ5QlqetCYMZIehmH+eq4FgwTnz3Pld2lGзFNDXcu4yCkm+6pMmQ+O60CkK5dFwAzzhiLQYf8L8qStesi0K53yvciAV0wk/Tkuohd4iCcSLqTdKl8HKm0kHTPwHW1kZiyRnd08rNYjBf9Ur4Cfrz15bmkf+IgvLFcVm+MxG5qdEfnWtVFC+ZZb8Nl29c4CH8UM7XYsGvFL4D/3OlwwJQuJf1ipuw1QgbYr+mK5InyoJm3X0o/ETJAhaKrdGz35zEOwke6T4QMsM/kxNfPJT0PPWgIGcCsqfLZp8GO0xAygHlj5S2auetCXCBkADvGysdpvrguxDZCBrDrrrhv02AQMoB98zgIBzMgTMgAbsw0kJknQgZwZ6o8aCauCzGJkAHcmsrzrQiEDOBeOcXtZdAQMkA3eBs0hAzQHV4GDSEDdIt3QUPIAN3jVdAQMkA3eRM0hAzQXV4EDSEDdFvvg4aQAbqv10FDyAD9UAZN7/Y6ETJAf/QyaAgZoF/KTZW9CRpCBuifqaTe3PiKkAH66бIvd9gjZID+mvfhDG5CBui3r3EQNj3l0ipCBui/xy6voSFkgP7r9NQ2IQP4YSzp2XURuxAygD+mXZxxImQAv8y7dhwuIQP4p1MDwYQM4KcfXRkIJmQAP03Uka0HhAzgr8surAgmZAC/fXU9PkPIAP5zOj5DyAD+m8jh+AwhAwzDpav1MyNJKxcXBnb46boAz32Ng3Bi+6IjSUvbFwUq8AvPrLEcdJtG4rcHumPpuoABmNme1h5FWfIkaW3zosAOiyhL+BzacWez21QO/H6zdUGgwnfXBQyI1W5TGTIPojUDd5ZRlixdFzEw1rpNI0kqmqlXNi4IbOGz586djUV6L+tkirGZJ9MXBLbcRlmSui5ioKx0m7YX412JaUTYs4iyZOG6iIG7jINwZvICr0Km6DZdiKCBeYsoS+gmdcOjyW7Tm20FG0FD1wmm3BMwnTKRZGwQeOfepShL1lGWfJJ0K2ad0J5U0kWUJV8c14G3rk2tndm7QTLKkgdJ55LuRdjgeKmkqyhLzpmq7qyxpK8m3vis7jcWfbZLSX9KmipvYgFVVsWfv4qZy94pBkQ7eZaRQRdt/yKoHTK7mB6VRi+toyzxYuJgoCGzirLkQ5tveFLIAD4baMhIedd20dabcdMqANvu2nwzQgbAtkkchF/aejNCBsAu120t0CNkAOwyVksL9AgZAFVaac0QMgCqtNKaIWQA7HNya4aQAbDPya0ZQgbAISe1ZggZAIeMJc2PfTEhA6CO62NfSMgAqGNy7FnahAyAuj4f8yJCBkBds2Nu70LIAGiicWuGkAHQxLzpdDYhA6CpRovzCBkATTXqMhEyAJqaxEF4WfebCRkAx/iz7jcSMgCOUXsAmJABcKxaXSZCBsCxau1nImQAHGta5/xsQgbAKQ52mQgZAKc4uGaGkAFwioNdJkIGwKn2dpkIGQCn2ttlI       <div>
        <h1>Конструктор рецензий на книги</h1>
        <div class="sub">Заполните анкету — получите готовый пост.</div>
      </div>
    </header>

    <section class="card" id="formCard">
      <h2>Анкета</h2>
      <label>Название книги
        <input type="text" id="title" placeholder="Например: Спроси маму" required>
      </label>
      <label>Автор(ы)
        <input type="text" id="author" placeholder="Эрик Рис / Джулия Кэмерон…">
      </label>
      <label>Когда закончили
        <input type="date" id="finished">
      </label>
      <label>Оценка (0–10)
        <input type="text" id="rating" inputmode="decimal" placeholder="8.5">
      </label>
      <label>Ключевая мысль
        <input type="text" id="keyIdea" placeholder="Главное, что вынесли из книги">
      </label>
      <label>Кому будет полезна
        <input type="text" id="audience" placeholder="Кому порекомендуете и почему">
      </label>
      <label>О чём книга (кратко)
        <textarea id="summary" placeholder="1–3 предложения"></textarea>
      </label>
      <label>Сильные стороны
        <textarea id="pros" placeholder="Что особенно понравилось"></textarea>
      </label>
      <label>Что можно улучшить
        <textarea id="cons" placeholder="Замечания, спорные моменты"></textarea>
      </label>
      <label>Любимые цитаты
        <textarea id="quotes" placeholder="Каждую с новой строки"></textarea>
        <div class="hint">Цитаты будут оформлены кавычками и тире</div>
      </label><div class="toolbar" id="bottomBar">
        <button class="ok" id="btnCopy" title="Скопировать в буфер">Скопировать</button>
        <button class="warn" id="btnClear">Очистить</button>
        <button id="btnShareTg" title="Открыть Telegram со сгенерированным текстом">Поделиться в Telegram</button>
      </div>
      <div class="hint" style="margin-top:8px">Данные не сохраняются — всё, что вы вводите, остаётся только на этой странице.</div>
    </section>

    <section class="card">
      <h2>Ваш пост</h2>
      <textarea id="output" class="out" placeholder="Здесь появится готовый текст…"></textarea>
      <div class="footer">Скопируйте текст или используйте кнопки.</div>
    </section>

    <p class="footer">★ Проект статичен — удобно для GitHub Pages.</p>
  </div>

<script>
(function(){
  const $ = (s)=>document.querySelector(s);
  const $$ = (s)=>Array.from(document.querySelectorAll(s));
  const fields = ['title','author','finished','rating','keyIdea','audience','summary','pros','cons','quotes'];
  const els = Object.fromEntries(fields.map(id=>[id,$('#'+id)]));
  const out = $('#output');

  // Универсальный вызов Telegram-приложения с выбором чата (строго приложение)
  function openTelegramWithText(message){
    const isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isDesktop = !isIOS && !isAndroid;

    // Сначала копируем текст — чтобы можно было быстро вставить
    (async()=>{
      try{ await navigator.clipboard.writeText(message); toast('Текст скопирован — откройте Telegram и выберите чат'); }catch{
        try{ const ta=document.createElement('textarea'); ta.value=message; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Текст скопирован — откройте Telegram и выберите чат'); }catch{}
      }
    })();

    // Telegram Desktop часто не принимает payload в deep-link: открываем приложение, а текст уже в буфере
    const deepCandidates = isDesktop 
      ? ['tg://'] 
      : [
          'tg://msg?text=' + encodeURIComponent(message),
          'tg://share?text=' + encodeURIComponent(message),
          'tg://msg_url?text=' + encodeURIComponent(message),
        ];

    const openStore = ()=>{
      if(isAndroid){
        location.href = 'market://details?id=org.telegram.messenger';
        setTimeout(()=>{ location.href = 'https://play.google.com/store/apps/details?id=org.telegram.messenger'; }, 800);
      } else if(isIOS){
        location.href = 'https://apps.apple.com/app/telegram-messenger/id686449807';
      } else if(isDesktop){
        location.href = 'https://desktop.telegram.org/';
      }
    };

    let tried = false;
    const tryOpen = (url)=>{
      tried = true;
      let done = false;
      const clear = ()=>{ if(done) return; done = true; clearTimeout(timer); cleanup(); };
      const onHide = ()=>{ if(document.hidden) clear(); };
      const cleanup = ()=>{
        document.removeEventListener('visibilitychange', onHide);
        window.removeEventListener('pagehide', clear);
        window.removeEventListener('blur', clear);
      };
      document.addEventListener('visibilitychange', onHide, { once:true });
      window.addEventListener('pagehide', clear, { once:true });
      window.addEventListener('blur', clear, { once:true });
      const timer = setTimeout(()=>{ if(!done) { cleanup(); openStore(); } }, 1000);
      try { location.replace(url); } catch(_) { clear(); openStore(); }
    };

    for(const url of deepCandidates){ tryOpen(url); break; }
  }

  // Шаринг ссылки: строго в приложение через tg://msg_url?url=...
  function openTelegramWithLink(linkUrl){
    const isIOS = /iPad|iPhone|iPod/i.test(navigator.userAgent);
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isDesktop = !isIOS && !isAndroid;

    const deepUrl = 'tg://msg_url?url=' + encodeURIComponent(linkUrl);

    const openStore = ()=>{
      if(isAndroid){
        location.href = 'market://details?id=org.telegram.messenger';
        setTimeout(()=>{ location.href = 'https://play.google.com/store/apps/details?id=org.telegram.messenger'; }, 800);
      } else if(isIOS){
        location.href = 'https://apps.apple.com/app/telegram-messenger/id686449807';
      } else if(isDesktop){
        location.href = 'https://desktop.telegram.org/';
      }
    };

    let done = false;
    const onHide = ()=>{ if(document.hidden){ done = true; cleanup(); } };
    const cleanup = ()=>{
      document.removeEventListener('visibilitychange', onHide);
      window.removeEventListener('pagehide', cleanup);
      window.removeEventListener('blur', cleanup);
    };
    document.addEventListener('visibilitychange', onHide, { once:true });
    window.addEventListener('pagehide', cleanup, { once:true });
    window.addEventListener('blur', cleanup, { once:true });
    const timer = setTimeout(()=>{ if(!done) { cleanup(); openStore(); } }, 1000);
    try { location.replace(deepUrl); } catch(_) { clearTimeout(timer); openStore(); }
  }

  function val(id){ return (els[id] && els[id].value || '').trim(); }
  function section(title, body){ if(!body) return ''; return `${title}\n${body}\n\n— — —\n\n`; }
  function bulletify(text){ if(!text) return ''; return text.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>`• ${s}`).join('\n'); }
  function quoteBlock(text){ if(!text) return ''; return text.split(/\n+/).map(s=>s.trim()).filter(Boolean).map(s=>`«${s.replace(/^\"|\"$/g,'')}» —`).join('\n'); }
  function datePretty(v){ if(!v) return ''; try{ const d=new Date(v+'T00:00:00'); return d.toLocaleDateString('ru-RU',{year:'numeric',month:'long',day:'numeric'});}catch{return v;} }

  function buildPost(){
    const title = val('title');
    const author = val('author');
    const header = (title||author) ? `📚 ${title}${author? ' — '+author: ''}` : '📚 Рецензия';
    const meta = [ val('finished')?`закончил(а): ${datePretty(val('finished'))}`:'', val('rating')?`оценка: ${val('rating')}/10`:'' ].filter(Boolean).join(' · ');
    let intro = '';
    if(val('summary')) intro += `В книге говорилось о том, что ${val('summary')}. `;
    if(val('keyIdea')) intro += `На мой взгляд, из книги можно почерпнуть следующее: ${val('keyIdea')}. `;
    if(val('audience')) intro += `Хочу посоветовать эту книгу тем, кто ${val('audience')}.`;

    const blocks = [
      section(header + (meta? `\n${meta}`:''), intro),
      section('🧩 Краткое содержание', val('summary')),
      section('✅ Сильные стороны', bulletify(val('pros'))),
      section('⚠️ Что можно улучшить', bulletify(val('cons'))),
      section('💬 Цитаты', quoteBlock(val('quotes'))),
    ].join('');
    return blocks.trim();
  }

  function copyOut(){
    const text = out.value.trim();
    if(!text){ alert('Нет текста для копирования'); return; }
    navigator.clipboard.writeText(text).then(()=>toast('Скопировано'),()=>{
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Скопировано');
    });
  }
  function shareTelegram(){
    const text = out.value.trim();
    if(!text) return alert('Сначала заполните анкету');
    
    // Официальный Telegram Share Widget (https://core.telegram.org/widgets/share)
    // Работает на всех платформах: автоматически открывает приложение с выбором чата
    const shareUrl = 'https://t.me/share/url?url=' + encodeURIComponent('https://marketingadvantacs-coder.github.io/book-review/') + '&text=' + encodeURIComponent(text);
    window.location.href = shareUrl;
  }
  function toast(msg){
    const t=document.createElement('div'); t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 14px;border-radius:12px;box-shadow:0 6px 18px rgba(0,0,0,.2);z-index:9999';
    document.body.appendChild(t); setTimeout(()=>t.remove(),1400);
  }

  // Реальное обновление превью при вводе
  function wireRealtime(){
    $$('#formCard input, #formCard textarea').forEach(el=>{
      el.addEventListener('input', ()=>{ out.value = buildPost(); });
      el.addEventListener('change', ()=>{ out.value = buildPost(); });
    });
  }

  // Кнопки
  $('#btnCopy').addEventListener('click', copyOut);
  $('#btnClear').addEventListener('click', ()=>{
    if(!confirm('Очистить форму и вывод?')) return;
    Object.values(els).forEach(e=> e.value='');
    out.value='';
  });
  $('#btnShareTg').addEventListener('click', shareTelegram);

  // Старт
  wireRealtime();
  out.value = buildPost();
})();
</script>
